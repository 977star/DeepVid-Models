name: Sync Whisper Models to Releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process & Release Slim Whisper Small (Pure INT8)
        run: |
          set -e
          echo "=== 1. Processing Slim Whisper Small ==="
          mkdir -p work_small
          cd work_small

          echo "Downloading upstream sherpa-onnx-whisper-small..."
          curl -fL -o upstream_small.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-small.tar.bz2
          curl -fL -o silero_vad.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx

          echo "Extracting archive..."
          tar -xjf upstream_small.tar.bz2

          echo "Files before stripping:"
          ls -lh sherpa-onnx-whisper-small/

          echo "Stripping redundant FP32 files (saving ~920MB uncompressed)..."
          rm -f sherpa-onnx-whisper-small/small-decoder.onnx
          rm -f sherpa-onnx-whisper-small/small-encoder.onnx

          echo "Files after stripping (Pure INT8):"
          ls -lh sherpa-onnx-whisper-small/

          echo "Re-packaging into slim tar.bz2..."
          tar -cjf whisper-small-v1.0.0.tar.bz2 sherpa-onnx-whisper-small/

          echo "Calculating checksums & sizes..."
          ls -lh whisper-small-v1.0.0.tar.bz2
          sha256sum whisper-small-v1.0.0.tar.bz2 > checksums.txt
          sha256sum silero_vad.onnx >> checksums.txt
          cat checksums.txt

          echo "Uploading slim release assets to whisper-small-v1.0.0..."
          gh release upload whisper-small-v1.0.0 \
            whisper-small-v1.0.0.tar.bz2 \
            silero_vad.onnx \
            checksums.txt \
            --clobber

          cd ..
          rm -rf work_small
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
